<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Tarry</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #0a204b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px 25px;
      border-radius: 22px;
      box-shadow: 0 10px 35px rgba(10, 32, 75, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo svg {
      width: 66px;
      height: 76px;
    }

    .brand {
      font-family: Georgia, serif;
      font-size: 39px;
      letter-spacing: 7px;
      margin: 5px 0;
    }

    .tagline {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-top: 9px;
    }

    h1 {
      font-size: 27px;
      margin: 26px 0 8px;
      text-align: center;
    }

    .intro {
      color: #69758c;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 17px 0 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d8deea;
      border-radius: 10px;
      font-size: 16px;
      outline-color: #0a204b;
      background: white;
    }

    .submit {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: #0a204b;
      color: white;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 25px;
      cursor: pointer;
    }

    .signin {
      text-align: center;
      font-size: 14px;
      margin-top: 23px;
      line-height: 1.7;
    }

    a {
      color: #0a204b;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #7c879b;
      font-size: 12px;
      margin-top: 25px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">
      <svg viewBox="0 0 100 110" fill="#0a204b"
           xmlns="http://www.w3.org/2000/svg"
           aria-label="Bible and cross logo">
        <path d="M50 4 Q55 4 55 10 V39 H81 Q87 39 87 44 Q87 49 81 49 H55 V76 H45 V49 H19 Q13 49 13 44 Q13 39 19 39 H45 V10 Q45 4 50 4Z"/>
        <path d="M9 62 Q29 45 47 62 V96 Q28 79 9 91Z"/>
        <path d="M53 62 Q72 45 91 62 V91 Q72 79 53 96Z"/>
        <path d="M49 63 H51 V101 H49Z"/>
      </svg>

      <div class="brand">TARRY</div>
      <div class="tagline">DWELL · STUDY · GROW</div>
    </div>

    <h1>Create Account</h1>
    <p class="intro">
      Begin your journey toward deeper study,
      consistent prayer, and lasting growth.
    </p>

    <form id="signupForm">
      <label for="fullname">Full Name</label>
      <input id="fullname" name="fullname"
             type="text" placeholder="Enter your full name"
             autocomplete="name" required>

      <label for="email">Email Address</label>
      <input id="email" name="email"
             type="email" placeholder="you@example.com"
             autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password"
             type="password" placeholder="At least 8 characters"
             autocomplete="new-password" minlength="8" required>

      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" name="confirmPassword"
             type="password" placeholder="Enter password again"
             autocomplete="new-password" minlength="8" required>

      <button class="submit" type="submit">
        Create Account →
      </button>
    </form>

    <p class="signin">
      Already have an account?
      <a href="signin.html">Sign In</a>
    </p>

    <div class="footer">Together in His presence.</div>
  </main>

  <script>
    document.getElementById("signupForm").addEventListener(
      "submit", function(event) {
        event.preventDefault();

        const password =
          document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
          alert("Your passwords do not match. Please try again.");
          return;
        }

        alert(
          "Your details passed the form checks. " +
          "Account creation is not connected yet."
        );
      }
    );
  </script>
</body>
</html>
